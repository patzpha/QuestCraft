function cleanName(v){return(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').split('').filter(c=>GF[c]).join('').trim().slice(0,24);}
function uniqueName(nm){let r=nm,n=0;while(worlds.some(w=>w.name==r))r=nm+' ('+(++n)+')';return r;}
function wrapT(t,maxW,sc){const out=[];let cur='';for(const wd of t.split(' ')){const tr=cur?cur+' '+wd:wd;if(mw(tr)*sc>maxW&&cur){out.push(cur);cur=wd;}else cur=tr;}if(cur)out.push(cur);return out;}
